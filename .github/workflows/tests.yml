name: tests

# 222+ tests + 2 data-verification steps, run on every push/PR to catch regressions
# (for example: accidentally going back to xgboost/lightgbm, or drifting the numbers in reports).
on:
  push:
  pull_request:

jobs:
  unit-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Automated tests (anti-leak, reproducibility, metrics, registry)
        run: python -m unittest discover -s tests -v
      # audit_data automatically skips the groups that need data/sec/raw & reports/models/best.joblib
      # (already .gitignore'd), so it still runs clean on a public clone.
      - name: Cross-check report numbers against artifacts (audit_data)
        run: python -m scripts.audit_data
