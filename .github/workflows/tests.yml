name: tests

# Bộ 222+ test + 2 bước kiểm chứng dữ liệu, chạy trên mọi lần push/PR để phát hiện hồi quy
# (ví dụ: vô tình quay lại dùng xgboost/lightgbm, hoặc làm trôi số liệu trong báo cáo).
on:
  push:
  pull_request:

jobs:
  unit-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cài phụ thuộc
        run: python -m pip install -r requirements.txt
      - name: Test tự động (chống rò rỉ, tái lập, metric, registry)
        run: python -m unittest discover -s tests -v
      - name: Đối soát số liệu báo cáo ↔ artifact (98.200 phép kiểm tra)
        run: python -m scripts.audit_data
